[project]
name = "detection-regression-infer"
version = "0.1.0"
description = "YOLO の推論結果を detection-regression の共通 JSON スキーマで書き出す"
requires-python = ">=3.11"
dependencies = [
  "ultralytics>=8.3",
  "opencv-python>=4.9",
]

[project.scripts]
detection-regression-infer = "detection_regression_infer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detection_regression_infer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
